worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 30s;
    server_tokens off;
    client_max_body_size 16m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_x_forwarded_proto $selfhandler_forwarded_proto {
        ~*^https$ https;
        default $scheme;
    }

    map $selfhandler_forwarded_proto $selfhandler_fastcgi_https {
        https on;
        default off;
    }

    upstream selfhandler_fpm {
        server app:9000;
        keepalive 8;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name selfhandler.drpanya.uk 127.0.0.1 localhost;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        # same-origin (not no-referrer): the SPA must send a Referer on its own
        # /api requests so Sanctum recognizes them as stateful; the Referer is
        # still never leaked to third-party origins.
        add_header Referrer-Policy same-origin always;

        location = /api {
            try_files "" @laravel;
        }

        location ^~ /api/ {
            try_files "" @laravel;
        }

        location = /sanctum/csrf-cookie {
            try_files "" @laravel;
        }

        location = /up {
            try_files "" @laravel;
        }

        # This is the only PHP execution path. The client cannot select a PHP
        # file or PATH_INFO; every allowlisted request executes public/index.php.
        location @laravel {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass selfhandler_fpm;
            fastcgi_connect_timeout 3s;
            fastcgi_read_timeout 30s;
            fastcgi_send_timeout 30s;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
            fastcgi_param HTTP_X_FORWARDED_PROTO $selfhandler_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
            fastcgi_param HTTPS $selfhandler_fastcgi_https;
            fastcgi_param REQUEST_SCHEME $selfhandler_forwarded_proto;
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(?:css|js|mjs|json|map|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
