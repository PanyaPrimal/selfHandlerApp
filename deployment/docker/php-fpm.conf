[global]
daemonize = no
error_log = /proc/self/fd/2
pid = /tmp/php-fpm.pid

[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.backlog = 128
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 30s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php
