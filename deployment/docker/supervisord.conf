; One app lifecycle: deployment/restore stop HTTP and background writers together.
; Only the container's application user can access the control socket.
[unix_http_server]
file=/tmp/selfhandler-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/selfhandler-supervisor.pid
childlogdir=/tmp
loglevel=warn

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/selfhandler-supervisor.sock

[program:fpm]
command=/usr/local/sbin/php-fpm -F
directory=/app
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/php /app/artisan schedule:work --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=/usr/local/bin/php /app/artisan queue:work database --queue=default,mentor --sleep=3 --tries=3 --backoff=10 --timeout=60 --memory=128 --max-time=3600 --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chatgpt]
command=/usr/local/bin/node /opt/chatgpt/server.mjs
directory=/app
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
