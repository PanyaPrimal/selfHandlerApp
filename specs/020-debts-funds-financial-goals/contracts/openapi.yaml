openapi: 3.1.0
info:
  title: SelfHandler Debts, Funds, Financial Goals, and Purchase Links API
  version: 0.20.0
  description: >-
    Closed authenticated contracts for feature 020. Money values are exact decimal strings and all
    calendar dates are interpreted in the authenticated user's Profile timezone.
servers:
  - url: /api
security:
  - sanctum: []
paths:
  /finance/counterparties:
    get:
      operationId: listFinanceCounterparties
      parameters:
        - $ref: '#/components/parameters/Archived'
      responses:
        '200':
          description: Ordered owned counterparties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterpartyListResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createFinanceCounterparty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterpartyCreateInput'
      responses:
        '201':
          description: Counterparty created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterpartyItemResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/counterparties/{counterparty}:
    parameters:
      - $ref: '#/components/parameters/CounterpartyId'
    patch:
      operationId: updateFinanceCounterparty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterpartyUpdateInput'
      responses:
        '200':
          description: Counterparty updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterpartyItemResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/debts:
    get:
      operationId: listFinanceDebts
      parameters:
        - $ref: '#/components/parameters/Archived'
      responses:
        '200':
          description: Owned debts with bounded derived schedule and progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtListResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createFinanceDebt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtCreateInput'
      responses:
        '201':
          description: Debt created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtItemResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/debts/{debt}:
    parameters:
      - $ref: '#/components/parameters/DebtId'
    patch:
      operationId: updateFinanceDebt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtUpdateInput'
      responses:
        '200':
          description: Debt updated without rewriting accepted facts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtItemResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/debts/{debt}/payments:
    parameters:
      - $ref: '#/components/parameters/DebtId'
    post:
      operationId: createFinanceDebtPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtPaymentInput'
      responses:
        '200':
          description: Existing idempotent payment returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtPaymentResponse'
        '201':
          description: Payment and ordinary ledger fact created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtPaymentResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/saving-funds:
    get:
      operationId: listFinanceSavingFunds
      parameters:
        - $ref: '#/components/parameters/Archived'
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Owned funds with exact current and selected-month projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundListResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createFinanceSavingFund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundCreateInput'
      responses:
        '201':
          description: Saving fund created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundItemResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/saving-funds/{fund}:
    parameters:
      - $ref: '#/components/parameters/FundId'
    patch:
      operationId: updateFinanceSavingFund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundUpdateInput'
      responses:
        '200':
          description: Fund updated without rewriting allocation or money history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundItemResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/saving-funds/{fund}/movements:
    parameters:
      - $ref: '#/components/parameters/FundId'
    post:
      operationId: createFinanceFundMovement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundMovementInput'
      responses:
        '200':
          description: Existing idempotent movement returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundMovementResponse'
        '201':
          description: Allocation or linked-account transfer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundMovementResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/goals:
    get:
      operationId: listFinanceGoals
      parameters:
        - $ref: '#/components/parameters/Archived'
      responses:
        '200':
          description: Common Goals of Finance type with module-owned progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceGoalListResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createFinanceGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceGoalCreateInput'
      responses:
        '201':
          description: Common Goal and Finance detail created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceGoalItemResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/goals/{goal}:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    patch:
      operationId: updateFinanceGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceGoalUpdateInput'
      responses:
        '200':
          description: Finance Goal lifecycle or checkpoints updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceGoalItemResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/source-expenses:
    post:
      operationId: createFinanceSourceExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceExpenseInput'
      responses:
        '200':
          description: Existing idempotent active source expense returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceExpenseResponse'
        '201':
          description: Linked source expense created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceExpenseResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/planned-occurrences:
    get:
      operationId: listFinancePlannedOccurrences
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Bounded recurring-operation, debt, and fund occurrences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceListResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /finance/planned-occurrences/{occurrence}/outcome:
    parameters:
      - $ref: '#/components/parameters/OccurrenceId'
    put:
      operationId: putFinanceOccurrenceOutcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrenceOutcomeInput'
      responses:
        '200':
          description: Existing idempotent outcome returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceItemResponse'
        '201':
          description: Outcome created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceItemResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: clearFinanceOccurrenceOutcome
      responses:
        '200':
          description: A reversible skipped outcome was cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceItemResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /finance/cash-flow:
    get:
      operationId: showFinanceCashFlow
      parameters:
        - $ref: '#/components/parameters/MonthRequired'
      responses:
        '200':
          description: Recurring cash flow plus debt and mandatory emergency commitments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
components:
  securitySchemes:
    sanctum:
      type: apiKey
      in: cookie
      name: selfhandler_session
  parameters:
    Archived:
      name: archived
      in: query
      required: false
      schema: { type: boolean, default: false }
    Month:
      name: month
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Month' }
    MonthRequired:
      name: month
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Month' }
    From:
      name: from
      in: query
      required: true
      schema: { $ref: '#/components/schemas/LocalDate' }
    To:
      name: to
      in: query
      required: true
      schema: { $ref: '#/components/schemas/LocalDate' }
    CounterpartyId:
      name: counterparty
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DebtId:
      name: debt
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    FundId:
      name: fund
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    GoalId:
      name: goal
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OccurrenceId:
      name: occurrence
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthenticated:
      description: Authentication required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    NotFound:
      description: Owned resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Conflict:
      description: The requested transition conflicts with accepted immutable history.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    ValidationFailed:
      description: Closed input validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrors' }
  schemas:
    LocalDate:
      type: string
      format: date
    Month:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    LocalTime:
      type: [string, 'null']
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    Money:
      type: string
      pattern: '^-?(0|[1-9]\d{0,14})\.\d{4}$'
    PositiveMoney:
      type: string
      pattern: '^(0\.\d{3}[1-9]|0\.\d{2}[1-9]\d|0\.\d[1-9]\d{2}|0\.[1-9]\d{3}|[1-9]\d{0,14}\.\d{4})$'
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
    Timestamp:
      type: [string, 'null']
      format: date-time
    Message:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string }
    ValidationErrors:
      type: object
      additionalProperties: false
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    CounterpartyCreateInput:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        kind: { type: string, enum: [person, bank, store, other] }
        note: { type: [string, 'null'], maxLength: 5000 }
    CounterpartyUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        kind: { type: string, enum: [person, bank, store, other] }
        note: { type: [string, 'null'], maxLength: 5000 }
        archived: { type: boolean }
    Counterparty:
      type: object
      additionalProperties: false
      required: [id, name, kind, note, archived, created_at, updated_at]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        kind: { type: string, enum: [person, bank, store, other] }
        note: { type: [string, 'null'] }
        archived: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    CounterpartyItemResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Counterparty' }
    CounterpartyListResponse:
      type: object
      additionalProperties: false
      required: [data, kinds]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Counterparty' }
        kinds:
          type: array
          items: { type: string, enum: [person, bank, store, other] }
    DebtScheduleInput:
      type: object
      additionalProperties: false
      required: [installment_amount, installment_count, interval_months, monthday, first_due_on, reminder_time]
      properties:
        installment_amount: { $ref: '#/components/schemas/PositiveMoney' }
        installment_count: { type: integer, minimum: 1, maximum: 120 }
        interval_months: { type: integer, minimum: 1, maximum: 12 }
        monthday: { type: integer, minimum: 1, maximum: 31 }
        first_due_on: { $ref: '#/components/schemas/LocalDate' }
        reminder_time: { $ref: '#/components/schemas/LocalTime' }
    DebtCreateInput:
      type: object
      additionalProperties: false
      required: [name, counterparty_id, direction, repayment_mode, original_amount, currency,
        originated_on, deadline, account_id, category_id, purchase_item_id, schedule, note]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        counterparty_id: { type: integer, minimum: 1 }
        direction: { type: string, enum: [owe, owed_to_me] }
        repayment_mode: { type: string, enum: [fixed, flexible] }
        original_amount: { $ref: '#/components/schemas/PositiveMoney' }
        currency: { $ref: '#/components/schemas/Currency' }
        originated_on: { $ref: '#/components/schemas/LocalDate' }
        deadline: { type: [string, 'null'], format: date }
        account_id: { type: [integer, 'null'], minimum: 1 }
        category_id: { type: [integer, 'null'], minimum: 1 }
        purchase_item_id: { type: [integer, 'null'], minimum: 1 }
        schedule:
          oneOf:
            - $ref: '#/components/schemas/DebtScheduleInput'
            - type: 'null'
        note: { type: [string, 'null'], maxLength: 5000 }
    DebtUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        counterparty_id: { type: integer, minimum: 1 }
        deadline: { type: [string, 'null'], format: date }
        account_id: { type: [integer, 'null'], minimum: 1 }
        category_id: { type: [integer, 'null'], minimum: 1 }
        schedule:
          oneOf:
            - $ref: '#/components/schemas/DebtScheduleInput'
            - type: 'null'
        note: { type: [string, 'null'], maxLength: 5000 }
        active: { type: boolean }
        archived: { type: boolean }
    DebtPaymentInput:
      type: object
      additionalProperties: false
      required: [planned_occurrence_id, amount, account_id, category_id, occurred_on, idempotency_key, note]
      properties:
        planned_occurrence_id: { type: [integer, 'null'], minimum: 1 }
        amount:
          oneOf:
            - { $ref: '#/components/schemas/PositiveMoney' }
            - { type: 'null' }
        account_id: { type: integer, minimum: 1 }
        category_id: { type: integer, minimum: 1 }
        occurred_on: { $ref: '#/components/schemas/LocalDate' }
        idempotency_key: { type: string, minLength: 1, maxLength: 120 }
        note: { type: [string, 'null'], maxLength: 5000 }
    PaymentSummary:
      type: object
      additionalProperties: false
      required: [id, planned_occurrence_id, transaction_public_id, principal_amount, currency,
        occurred_on, reversed]
      properties:
        id: { type: integer, minimum: 1 }
        planned_occurrence_id: { type: [integer, 'null'], minimum: 1 }
        transaction_public_id: { type: string, format: uuid }
        principal_amount: { $ref: '#/components/schemas/PositiveMoney' }
        currency: { $ref: '#/components/schemas/Currency' }
        occurred_on: { $ref: '#/components/schemas/LocalDate' }
        reversed: { type: boolean }
    DebtOccurrence:
      type: object
      additionalProperties: false
      required: [id, due_on, original_due_on, amount, currency, status, reminder_time, latest_payment]
      properties:
        id: { type: integer, minimum: 1 }
        due_on: { $ref: '#/components/schemas/LocalDate' }
        original_due_on: { $ref: '#/components/schemas/LocalDate' }
        amount: { $ref: '#/components/schemas/PositiveMoney' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [scheduled, paid, overdue] }
        reminder_time: { $ref: '#/components/schemas/LocalTime' }
        latest_payment:
          oneOf:
            - $ref: '#/components/schemas/PaymentSummary'
            - type: 'null'
    Debt:
      type: object
      additionalProperties: false
      required: [id, name, counterparty, direction, repayment_mode, original_amount, paid_amount,
        remaining_amount, currency, progress, originated_on, deadline, state, account_id, category_id,
        purchase_item_id, active, archived, schedule, occurrences, payments, counts, created_at, updated_at]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        counterparty: { $ref: '#/components/schemas/Counterparty' }
        direction: { type: string, enum: [owe, owed_to_me] }
        repayment_mode: { type: string, enum: [fixed, flexible] }
        original_amount: { $ref: '#/components/schemas/PositiveMoney' }
        paid_amount: { $ref: '#/components/schemas/Money' }
        remaining_amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        progress: { type: number, minimum: 0, maximum: 1 }
        originated_on: { $ref: '#/components/schemas/LocalDate' }
        deadline: { type: [string, 'null'], format: date }
        state: { type: string, enum: [active, overdue, settled] }
        account_id: { type: [integer, 'null'], minimum: 1 }
        category_id: { type: [integer, 'null'], minimum: 1 }
        purchase_item_id: { type: [integer, 'null'], minimum: 1 }
        active: { type: boolean }
        archived: { type: boolean }
        schedule:
          oneOf:
            - $ref: '#/components/schemas/DebtScheduleInput'
            - type: 'null'
        occurrences:
          type: array
          maxItems: 120
          items: { $ref: '#/components/schemas/DebtOccurrence' }
        payments:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PaymentSummary' }
        counts: { $ref: '#/components/schemas/DebtCounts' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    DebtCounts:
      type: object
      additionalProperties: false
      required: [scheduled, paid, overdue]
      properties:
        scheduled: { type: integer, minimum: 0 }
        paid: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
    DebtItemResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Debt' }
    DebtListResponse:
      type: object
      additionalProperties: false
      required: [data, totals, directions, repayment_modes]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Debt' }
        totals: { $ref: '#/components/schemas/DebtTotals' }
        directions:
          type: array
          items: { type: string, enum: [owe, owed_to_me] }
        repayment_modes:
          type: array
          items: { type: string, enum: [fixed, flexible] }
    DebtTotals:
      type: object
      additionalProperties: false
      required: [base_currency, complete, owe, owed_to_me, missing_currencies]
      properties:
        base_currency: { $ref: '#/components/schemas/Currency' }
        complete: { type: boolean }
        owe:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        owed_to_me:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        missing_currencies:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Currency' }
    DebtPaymentResponse:
      type: object
      additionalProperties: false
      required: [data, debt]
      properties:
        data: { $ref: '#/components/schemas/PaymentSummary' }
