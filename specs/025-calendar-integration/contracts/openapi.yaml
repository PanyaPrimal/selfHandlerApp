openapi: 3.1.0
info:
  title: SelfHandler Calendar Integration API
  version: 1.0.0
  description: Owner-scoped Google Calendar and Apple CalDAV connection, settings, synchronization, and removal.
servers:
  - url: /api
security:
  - sessionAuth: []
paths:
  /integrations/calendars:
    get:
      operationId: listCalendarIntegrations
      responses:
        '200':
          description: Current owner's calendar connections and provider availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarIntegrationCollection'
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /integrations/calendars/google/authorize:
    post:
      operationId: authorizeGoogleCalendar
      responses:
        '200':
          description: Short-lived provider authorization URL; no token is returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorization_url, expires_at]
                properties:
                  authorization_url: { type: string, format: uri, maxLength: 4096 }
                  expires_at: { type: string, format: date-time }
        '409': { $ref: '#/components/responses/CalendarProblem' }
        '422': { $ref: '#/components/responses/CalendarProblem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /integrations/calendars/google/callback:
    get:
      operationId: completeGoogleCalendarAuthorization
      security: []
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string, minLength: 32, maxLength: 512 }
        - in: query
          name: code
          required: false
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - in: query
          name: error
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '302':
          description: Redirect to configured Settings route with one closed result code.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
        '400': { $ref: '#/components/responses/CalendarProblem' }
  /integrations/calendars/apple/connect:
    post:
      operationId: connectAppleCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account, app_specific_password]
              properties:
                account: { type: string, format: email, maxLength: 254 }
                app_specific_password: { type: string, minLength: 4, maxLength: 128, writeOnly: true }
      responses:
        '201':
          description: Pending connection plus discovered calendars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarConnectResponse'
        '409': { $ref: '#/components/responses/CalendarProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '502': { $ref: '#/components/responses/CalendarProblem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /integrations/calendars/{integration}/calendars:
    get:
      operationId: listProviderCalendars
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      responses:
        '200':
          description: Calendars discoverable with the current encrypted credential.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/CalendarDescriptor' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CalendarProblem' }
        '502': { $ref: '#/components/responses/CalendarProblem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /integrations/calendars/{integration}/selection:
    put:
      operationId: selectProviderCalendar
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [calendar_id]
              properties:
                calendar_id: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: Active selected connection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarIntegrationItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '502': { $ref: '#/components/responses/CalendarProblem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /integrations/calendars/{integration}:
    patch:
      operationId: updateCalendarIntegration
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarSettingsInput'
      responses:
        '200':
          description: Updated owner-visible settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarIntegrationItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      operationId: disconnectCalendarIntegration
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { const: DISCONNECT }
      responses:
        '204':
          description: Local credentials, projections, and mappings removed; remote/local facts unchanged.
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /integrations/calendars/{integration}/sync:
    post:
      operationId: syncCalendarIntegration
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      responses:
        '200':
          description: Complete serialized synchronization result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CalendarSyncResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CalendarProblem' }
        '429': { $ref: '#/components/responses/CalendarProblem' }
        '502': { $ref: '#/components/responses/CalendarProblem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: selfhandler_session
  parameters:
    IntegrationId:
      in: path
      name: integration
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    CalendarProvider:
      type: string
      enum: [google_calendar, apple_calendar]
    CalendarStatus:
      type: string
      enum: [pending, active, expired, revoked]
    CalendarImportDetail:
      type: string
      enum: [busy_only, title]
    CalendarExportCategory:
      type: string
      enum: [time_block, routine, sleep, habit, workout, supplement, finance]
    CalendarProviderAvailability:
      type: object
      additionalProperties: false
      required: [provider, available, connection_mode, android_connect_supported]
      properties:
        provider: { $ref: '#/components/schemas/CalendarProvider' }
        available: { type: boolean }
        connection_mode: { type: string, enum: [oauth_browser, app_specific_password] }
        android_connect_supported: { type: boolean }
        unavailable_code:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CalendarErrorCode'
    CalendarSettings:
      type: object
      additionalProperties: false
      required: [import_detail, export_categories]
      properties:
        import_detail: { $ref: '#/components/schemas/CalendarImportDetail' }
        export_categories:
          type: array
          uniqueItems: true
          maxItems: 7
          items: { $ref: '#/components/schemas/CalendarExportCategory' }
    CalendarSettingsInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        import_detail: { $ref: '#/components/schemas/CalendarImportDetail' }
        export_categories:
          type: array
          uniqueItems: true
          maxItems: 7
          items: { $ref: '#/components/schemas/CalendarExportCategory' }
    CalendarIntegration:
      type: object
      additionalProperties: false
      required: [id, provider, status, account, calendar, settings, last_sync_at, last_success_at, last_error_code]
      properties:
        id: { type: integer, minimum: 1 }
        provider: { $ref: '#/components/schemas/CalendarProvider' }
        status: { $ref: '#/components/schemas/CalendarStatus' }
        account: { type: [string, 'null'], maxLength: 512, description: Masked provider account label. }
        calendar:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SelectedCalendar'
        settings: { $ref: '#/components/schemas/CalendarSettings' }
        last_sync_at: { type: [string, 'null'], format: date-time }
        last_success_at: { type: [string, 'null'], format: date-time }
        last_error_code:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CalendarErrorCode'
    SelectedCalendar:
      type: object
      additionalProperties: false
      required: [name, timezone, writable]
      properties:
        name: { type: string, maxLength: 512 }
        timezone: { type: [string, 'null'], maxLength: 128 }
        writable: { type: boolean }
    CalendarDescriptor:
      type: object
      additionalProperties: false
      required: [id, name, timezone, writable, is_default]
      properties:
        id: { type: string, minLength: 1, maxLength: 4096 }
        name: { type: string, maxLength: 512 }
        timezone: { type: [string, 'null'], maxLength: 128 }
        writable: { type: boolean }
        is_default: { type: boolean }
    CalendarIntegrationCollection:
      type: object
      additionalProperties: false
      required: [data, providers]
      properties:
        data:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/CalendarIntegration' }
        providers:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/CalendarProviderAvailability' }
    CalendarIntegrationItem:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/CalendarIntegration' }
    CalendarConnectResponse:
      type: object
      additionalProperties: false
      required: [data, calendars]
      properties:
        data: { $ref: '#/components/schemas/CalendarIntegration' }
        calendars:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CalendarDescriptor' }
    CalendarSyncResult:
      type: object
      additionalProperties: false
      required: [imported, updated, removed, exported, deleted, conflicts, unchanged, completed_at]
      properties:
        imported: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        exported: { type: integer, minimum: 0 }
        deleted: { type: integer, minimum: 0 }
        conflicts: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        completed_at: { type: string, format: date-time }
    CalendarErrorCode:
      type: string
      enum:
        - calendar_provider_unavailable
        - calendar_oauth_invalid_state
        - calendar_oauth_denied
        - calendar_credentials_invalid
        - calendar_discovery_failed
        - calendar_not_found
        - calendar_read_only
        - calendar_connection_inactive
        - calendar_sync_busy
        - calendar_auth_expired
        - calendar_rate_limited
        - calendar_provider_timeout
        - calendar_provider_invalid_response
        - calendar_sync_failed
    Problem:
      type: object
      additionalProperties: false
      required: [message, code]
      properties:
        message: { type: string }
        code: { $ref: '#/components/schemas/CalendarErrorCode' }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    ValidationProblem:
      type: object
      additionalProperties: false
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  responses:
    Unauthenticated:
      description: Authentication required.
    NotFound:
      description: Owner-scoped resource not found.
    CalendarProblem:
      description: Safe closed calendar integration failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationProblem:
      description: Localized Laravel validation failure with a closed field map.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
