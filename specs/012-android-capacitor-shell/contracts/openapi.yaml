openapi: 3.1.0
info:
  title: SelfHandler Android Mobile Boundary
  version: 0.1.0
  description: Device-token lifecycle and Android local-presentation acknowledgment for feature 012.
servers:
  - url: https://selfhandler.example.test
    description: Build-time configured HTTPS API origin
tags:
  - name: Mobile session
  - name: Mobile notifications
paths:
  /api/mobile/session:
    post:
      tags: [Mobile session]
      operationId: createMobileSession
      summary: Exchange existing account credentials for one expiring Android device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginInput'
      responses:
        '201':
          description: Token returned once with the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSessionCreated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Mobile session]
      operationId: getMobileSession
      summary: Restore the current Android session from a valid mobile token
      security:
        - mobileBearer: []
      responses:
        '200':
          description: Current token-owned user and expiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSessionCurrent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MobileTokenRequired'
    delete:
      tags: [Mobile session]
      operationId: deleteMobileSession
      summary: Revoke only the current Android device token
      security:
        - mobileBearer: []
      responses:
        '204':
          description: Current token revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MobileTokenRequired'
  /api/mobile/notifications/{notification}/presented:
    put:
      tags: [Mobile notifications]
      operationId: acknowledgeAndroidLocalPresentation
      summary: Idempotently append android_local after successful native presentation
      security:
        - mobileBearer: []
      parameters:
        - name: notification
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Owner-scoped delivered notification with updated channels
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PresentationAcknowledgment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MobileTokenRequired'
        '404':
          description: Missing or foreign notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Notification is not currently an unread delivered event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum mobile token
  schemas:
    MobileLoginInput:
      type: object
      additionalProperties: false
      required: [email, password, device_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
        device_name:
          type: string
          minLength: 1
          maxLength: 64
    MobileSessionCreated:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [token, token_type, expires_at, user]
          properties:
            token:
              type: string
              minLength: 10
              description: Plaintext token returned only by this creation response.
            token_type:
              const: Bearer
            expires_at:
              type: string
              format: date-time
            user:
              $ref: '#/components/schemas/User'
    MobileSessionCurrent:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [expires_at, user]
          properties:
            expires_at:
              type: string
              format: date-time
            user:
              $ref: '#/components/schemas/User'
    User:
      type: object
      description: Existing feature-003 safe UserResource shape; never contains token/password fields.
      required: [id, name, email, preferences]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        preferences:
          type: object
          required: [locale, timezone, unit_system, theme]
          properties:
            locale:
              enum: [en-GB, ru-UA, uk-UA]
            timezone:
              type: string
            unit_system:
              enum: [metric, imperial]
            theme:
              type: object
              additionalProperties: true
    PresentationAcknowledgment:
      type: object
      additionalProperties: false
      required: [id, status, channels]
      properties:
        id:
          type: integer
          format: int64
        status:
          const: sent
        channels:
          type: array
          uniqueItems: true
          contains:
            const: android_local
          items:
            enum: [in_app, android_local]
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationErrorBody:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
  responses:
    ValidationError:
      description: Invalid fields or generic invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
    RateLimited:
      description: Too many mobile login attempts
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Unauthenticated:
      description: Missing, invalid, expired, or revoked credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    MobileTokenRequired:
      description: A browser cookie session or a non-mobile token cannot invoke this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
