openapi: 3.1.0
info:
  title: SelfHandler Core Daily Loop API
  version: 1.0.0
  description: REST contract for feature 001-core-daily-loop.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /today:
    get:
      operationId: getToday
      summary: Get the current user's checklist and progress for one date
      parameters:
        - $ref: '#/components/parameters/DateQuery'
      responses:
        '200':
          description: Today aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /routines:
    get:
      operationId: listRoutines
      summary: List either current or archived routines for the current user
      parameters:
        - name: archived
          in: query
          description: False returns non-archived routines; true returns archived routines only.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Routine list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Routine'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createRoutine
      summary: Create a routine for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineCreateInput'
      responses:
        '201':
          description: Routine created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /routines/{routine}:
    patch:
      operationId: updateRoutine
      summary: Update, pause, archive, or restore a current user's routine
      description: Schedule-defining fields are rejected after the routine has its first daily log.
      parameters:
        - $ref: '#/components/parameters/RoutineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineUpdateInput'
      responses:
        '200':
          description: Routine updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /routines/{routine}/logs/{date}:
    put:
      operationId: setRoutineLog
      summary: Set a routine to done or skipped for one date
      parameters:
        - $ref: '#/components/parameters/RoutineId'
        - $ref: '#/components/parameters/DatePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Unrecognized properties are accepted for forward compatibility and ignored. In
                particular, a client-supplied user_id never changes the authenticated owner.
              additionalProperties: true
              required: [status]
              properties:
                status:
                  type: string
                  enum: [done, skipped]
                note:
                  type: [string, 'null']
                  maxLength: 2000
      responses:
        '200':
          description: Log created or updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RoutineLog'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: clearRoutineLog
      summary: Return one routine occurrence to pending
      parameters:
        - $ref: '#/components/parameters/RoutineId'
        - $ref: '#/components/parameters/DatePath'
      responses:
        '204':
          description: Existing log removed or already absent
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /daily-reviews/{date}:
    get:
      operationId: getDailyReview
      summary: Get the current user's review for one date
      parameters:
        - $ref: '#/components/parameters/DatePath'
      responses:
        '200':
          description: Review or null when no review exists
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/DailyReview'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    put:
      operationId: saveDailyReview
      summary: Create or update the current user's review for one date
      parameters:
        - $ref: '#/components/parameters/DatePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyReviewInput'
      responses:
        '200':
          description: Review saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DailyReview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /goals:
    get:
      operationId: listGoals
      summary: List either current or archived goals for the current user
      parameters:
        - name: archived
          in: query
          description: False returns non-archived goals; true returns archived goals only.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Goal list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createGoal
      summary: Create a general goal for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreateInput'
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /goals/{goal}:
    patch:
      operationId: updateGoal
      summary: Update lifecycle fields or content for a current user's goal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdateInput'
      responses:
        '200':
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /goals/{goal}/routines/{routine}:
    post:
      operationId: linkRoutineToGoal
      summary: Link two records owned by the current user
      description: >-
        The request body is optional and ignored. Both identifiers must belong to the authenticated
        user; a forged user_id or any other request property cannot change link ownership.
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/RoutineId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Link exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unlinkRoutineFromGoal
      summary: Remove only the relationship between two current-user records
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/RoutineId'
      responses:
        '204':
          description: Link removed or already absent
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: selfhandler_session
      description: >-
        First-party browser session established by the authentication API and evaluated by
        Laravel Sanctum. Unsafe requests also send X-XSRF-TOKEN after first fetching
        /sanctum/csrf-cookie. Bearer tokens are not a supported credential for this API.

  parameters:
    DateQuery:
      name: date
      in: query
      required: false
      description: Calendar date; defaults to today in the configured timezone
      schema:
        type: string
        format: date
        pattern: '^\d{4}-\d{2}-\d{2}$'
    DatePath:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
        pattern: '^\d{4}-\d{2}-\d{2}$'
    RoutineId:
      name: routine
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GoalId:
      name: goal
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthenticated:
      description: The session cookie is missing, expired, or does not resolve an authenticated user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthenticated.
    NotFound:
      description: Record is absent or does not belong to the current user
    ValidationFailed:
      description: Request input is invalid
      content:
        application/json:
          schema:
            type: object
            required: [message, errors]
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Routine:
      type: object
      required:
        - id
        - name
        - description
        - kind
        - day_period
        - schedule_type
        - weekdays
        - preferred_time
        - sort_order
        - is_active
        - is_archived
        - archived_at
        - starts_on
        - ends_on
        - goals
        - activities
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: [string, 'null']
          maxLength: 2000
        kind:
          type: string
          enum: [routine, sleep, habit]
        day_period:
          type: string
          enum: [morning, evening, anytime]
        schedule_type:
          type: string
          enum: [daily, weekdays]
        weekdays:
          type: array
          items:
            $ref: '#/components/schemas/Weekday'
        preferred_time:
          type: [string, 'null']
          description: Local wall-clock time as HH:mm or HH:mm:ss, depending on the database driver.
          pattern: '^\d{2}:\d{2}(?::\d{2})?$'
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        is_archived:
          type: boolean
        archived_at:
          type: [string, 'null']
          format: date-time
        starts_on:
          type: [string, 'null']
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        ends_on:
          type: [string, 'null']
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalSummary'
        activities:
          type: array
          items:
            type: object
            required: [id, name, sort_order, preferred_time, progress_total]
            properties:
              id: { type: integer, minimum: 1 }
              name: { type: string, maxLength: 160 }
              sort_order: { type: integer, minimum: 0 }
              preferred_time: { type: [string, 'null'] }
              progress_total: { type: [number, 'null'] }

    RoutineInput:
      type: object
      description: >-
        Leading and trailing string whitespace is trimmed. Unrecognized properties are rejected.
        The legacy user_id spoofing probe is accepted but ignored and never changes the authenticated
        owner. starts_on and ends_on must form a non-decreasing date window.
      additionalProperties: false
      properties:
        user_id:
          type: integer
          minimum: 1
          deprecated: true
          description: Ignored legacy compatibility field; the owner always comes from authentication.
        name:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '\S'
        description:
          type: [string, 'null']
          maxLength: 2000
        kind:
          type: string
          enum: [routine, sleep, habit]
        day_period:
          type: string
          enum: [morning, evening, anytime]
        schedule_type:
          type: string
          enum: [daily, weekdays]
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Weekday'
        preferred_time:
          type: [string, 'null']
          description: Local wall-clock time in exactly HH:mm form.
          pattern: '^\d{2}:\d{2}$'
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        is_archived:
          type: boolean
        starts_on:
          type: [string, 'null']
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        ends_on:
          type: [string, 'null']
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'

    RoutineCreateInput:
      allOf:
        - $ref: '#/components/schemas/RoutineInput'
        - type: object
          required: [name, schedule_type]
          if:
            properties:
              schedule_type:
                const: weekdays
          then:
            required: [weekdays]
          else:
            not:
              required: [weekdays]

    RoutineUpdateInput:
      allOf:
        - $ref: '#/components/schemas/RoutineInput'
        - type: object
          description: >-
            At least one recognized mutable field is required. Weekday requirements can also
            depend on the routine's stored schedule_type. Schedule-defining fields are immutable
            after the first log, as described by the operation.
          minProperties: 1
          anyOf:
            - required: [name]
            - required: [description]
            - required: [kind]
            - required: [schedule_type]
            - required: [weekdays]
            - required: [preferred_time]
            - required: [sort_order]
            - required: [is_active]
            - required: [is_archived]
            - required: [starts_on]
            - required: [ends_on]

    RoutineLog:
      type: object
      required: [id, routine_id, log_date, status, note, completed_at]
      properties:
        id:
          type: integer
        routine_id:
          type: integer
        log_date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        status:
          type: string
          enum: [done, skipped]
        note:
          type: [string, 'null']
          maxLength: 2000
        completed_at:
          type: [string, 'null']
          format: date-time

    DailyReview:
      type: object
      required:
        - id
        - review_date
        - mood
        - energy
        - stress
        - day_rating
        - went_well
        - improve_tomorrow
        - notes
        - completed_at
      properties:
        id:
          type: integer
          minimum: 1
        review_date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        mood:
          $ref: '#/components/schemas/Rating'
        energy:
          $ref: '#/components/schemas/Rating'
        stress:
          $ref: '#/components/schemas/Rating'
        day_rating:
          $ref: '#/components/schemas/Rating'
        went_well:
          type: [string, 'null']
          maxLength: 5000
        improve_tomorrow:
          type: [string, 'null']
          maxLength: 5000
        notes:
          type: [string, 'null']
          maxLength: 10000
        completed_at:
          type: string
          format: date-time

    DailyReviewInput:
      type: object
      description: >-
        At least one recognized review field is required. Unrecognized properties are accepted and
        ignored; in particular, a client-supplied user_id never changes the authenticated owner.
      additionalProperties: true
      minProperties: 1
      anyOf:
        - required: [mood]
        - required: [energy]
        - required: [stress]
        - required: [day_rating]
        - required: [went_well]
        - required: [improve_tomorrow]
        - required: [notes]
      properties:
        mood:
          $ref: '#/components/schemas/Rating'
        energy:
          $ref: '#/components/schemas/Rating'
        stress:
          $ref: '#/components/schemas/Rating'
        day_rating:
          $ref: '#/components/schemas/Rating'
        went_well:
          type: [string, 'null']
          maxLength: 5000
        improve_tomorrow:
          type: [string, 'null']
          maxLength: 5000
        notes:
          type: [string, 'null']
          maxLength: 10000

    Goal:
      type: object
      required:
        - id
        - name
        - description
        - type
        - status
        - target_date
        - completed_at
        - is_archived
        - archived_at
        - routines
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: [string, 'null']
          maxLength: 5000
        type:
          type: string
          enum: [general]
        status:
          type: string
          enum: [active, completed, abandoned]
        target_date:
          type: [string, 'null']
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        completed_at:
          type: [string, 'null']
          format: date-time
        is_archived:
          type: boolean
        archived_at:
          type: [string, 'null']
          format: date-time
        routines:
          type: array
          items:
            $ref: '#/components/schemas/RoutineSummary'

    GoalInput:
      type: object
      description: >-
        Leading and trailing string whitespace is trimmed. Goal type and lifecycle timestamps are
        server-managed and rejected when supplied. Other unrecognized properties are accepted and
        ignored; in particular, a client-supplied user_id never changes the authenticated owner.
      additionalProperties: true
      propertyNames:
        not:
          enum: [type, completed_at, archived_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '\S'
        description:
          type: [string, 'null']
          maxLength: 5000
        status:
          type: string
          enum: [active, completed, abandoned]
        target_date:
          type: [string, 'null']
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        is_archived:
          type: boolean

    GoalCreateInput:
      allOf:
        - $ref: '#/components/schemas/GoalInput'
        - type: object
          required: [name]

    GoalUpdateInput:
      allOf:
        - $ref: '#/components/schemas/GoalInput'
        - type: object
          description: At least one recognized mutable goal field is required.
          minProperties: 1
          anyOf:
            - required: [name]
            - required: [description]
            - required: [status]
            - required: [target_date]
            - required: [is_archived]

    GoalSummary:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 160
        status:
          type: string
          enum: [active, completed, abandoned]

    TodayGoalSummary:
      allOf:
        - $ref: '#/components/schemas/GoalSummary'
        - type: object
          required: [target_date]
          properties:
            target_date:
              type: [string, 'null']
              format: date
              pattern: '^\d{4}-\d{2}-\d{2}$'

    RoutineSummary:
      type: object
      required: [id, name, is_active, is_archived]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 160
        is_active:
          type: boolean
        is_archived:
          type: boolean

    TodayRoutine:
      allOf:
        - $ref: '#/components/schemas/RoutineSummary'
        - type: object
          required: [description, kind, day_period, preferred_time, sort_order, log, parent_state, activities, goals, current_streak]
          properties:
            kind:
              type: string
              enum: [routine, sleep, habit]
            day_period:
              type: string
              enum: [morning, evening, anytime]
            description:
              type: [string, 'null']
            preferred_time:
              type: [string, 'null']
              description: Local wall-clock time as HH:mm or HH:mm:ss, depending on the database driver.
              pattern: '^\d{2}:\d{2}(?::\d{2})?$'
            sort_order:
              type: integer
            log:
              oneOf:
                - $ref: '#/components/schemas/RoutineLog'
                - type: 'null'
            parent_state:
              type: string
              enum: [pending, done, skipped]
            activities:
              type: array
              items:
                type: object
                additionalProperties: true
            goals:
              type: array
              items:
                $ref: '#/components/schemas/GoalSummary'
            current_streak:
              type: integer
              minimum: 0

    CompletionSummary:
      type: object
      required: [scheduled, done, skipped, pending, completion_rate]
      properties:
        scheduled:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        completion_rate:
          type: number
          minimum: 0
          maximum: 100

    TodayResponse:
      type: object
      required: [date, summary, routines, goals, review, progress, routine_day, module_summaries]
      properties:
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        summary:
          $ref: '#/components/schemas/CompletionSummary'
        routines:
          type: array
          items:
            $ref: '#/components/schemas/TodayRoutine'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/TodayGoalSummary'
        review:
          oneOf:
            - $ref: '#/components/schemas/DailyReview'
            - type: 'null'
        progress:
          type: object
          required: [period_start, period_end, seven_day]
          properties:
            period_start:
              type: string
              format: date
              pattern: '^\d{4}-\d{2}-\d{2}$'
            period_end:
              type: string
              format: date
              pattern: '^\d{4}-\d{2}-\d{2}$'
            seven_day:
              $ref: '#/components/schemas/CompletionSummary'
        routine_day:
          type: object
          description: Shared morning/evening/anytime routine projection for this local date.
          additionalProperties: true
        module_summaries:
          type: object
          required: [sleep, routine_activities, workouts]
          properties:
            sleep:
              type: object
              additionalProperties: true
            routine_activities:
              type: object
              additionalProperties: true
            workouts:
              type: object
              additionalProperties: false
              required: [planned, completed, skipped, unplanned, duration_seconds, distance_m, strength_volume_kg]
              properties:
                planned: { type: integer, minimum: 0 }
                completed: { type: integer, minimum: 0 }
                skipped: { type: integer, minimum: 0 }
                unplanned: { type: integer, minimum: 0 }
                duration_seconds: { type: integer, minimum: 0 }
                distance_m: { type: integer, minimum: 0 }
                strength_volume_kg: { type: string }

    RoutineItemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Routine'

    GoalItemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Goal'

    Weekday:
      type: string
      enum: [MO, TU, WE, TH, FR, SA, SU]

    Rating:
      type: [integer, 'null']
      minimum: 1
      maximum: 10
